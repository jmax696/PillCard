; Mehrere Programme in einem Projekt. In VS Code unten in der Statusleiste
; die Umgebung wählen (z. B. env:codieren / env:decodieren) und hochladen.
; Standard ist das ESP32. Die uno_*-Umgebungen sind die Ausweichvariante für den Arduino Uno.

[platformio]
default_envs = decodieren

; ===== ESP32 (Keyestudio, aktuell benutzt) =====
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; RFID-Leser: aktuell das blaue SPI-Board (8 Pins). Für einen I2C-Leser mit 4 Pins
; (GND, VCC, SDA, SCL) die nächste Zeile einkommentieren.
; build_flags = -D PILLCARD_RFID_I2C
; MFRC522_I2C liegt korrigiert in lib/ (Original kkloesener/MFRC522_I2C, Public Domain)
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    madhephaestus/ESP32Servo@^3.0.5
    arduino-libraries/LiquidCrystal@^1.0.7

[env:codieren]
build_src_filter = +<codieren/>

[env:decodieren]
build_src_filter = +<decodieren/>

[env:bauteiltest]
build_src_filter = +<bauteiltest/>

[env:rfidtest]
build_src_filter = +<rfidtest/>

[env:esp32test]
build_src_filter = +<esp32test/>

; ===== Arduino Uno (Ausweichvariante) =====
[uno]
platform = atmelavr
board = uno
monitor_speed = 9600
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    arduino-libraries/Servo@^1.2.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:uno_codieren]
extends = uno
build_src_filter = +<codieren/>

[env:uno_decodieren]
extends = uno
build_src_filter = +<decodieren/>

[env:uno_bauteiltest]
extends = uno
build_src_filter = +<bauteiltest/>

[env:uno_rfidtest]
extends = uno
build_src_filter = +<rfidtest/>
