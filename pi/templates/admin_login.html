{% extends "admin_base.html" %}
{% block titel %}Verwaltung – PillCard{% endblock %}
{% block inhalt %}
<section class="karte schmal">
  <h1>Verwaltung</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Passwort
      <input name="passwort" type="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="gross">Anmelden</button>
  </form>
</section>
<p class="fuss"><a href="{{ url_for('login') }}">Zum Nutzerbereich</a></p>
{% endblock %}
